<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ReadTracker">
    <meta name="theme-color" content="#1a1a2e">
    <title>Reading Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Tab Content -->
        <main id="main-content"></main>

        <!-- Tab Bar -->
        <nav id="tab-bar" role="tablist" aria-label="Main navigation">
            <button class="tab-btn active" data-tab="books" role="tab" aria-selected="true" aria-label="Books">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>Books</span>
            </button>
            <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false" aria-label="Statistics">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
                <span>Statistics</span>
            </button>
        </nav>
    </div>

    <script src="js/store.js"></script>
    <script src="js/csv.js"></script>
    <script src="js/views.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
